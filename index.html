<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Web App</title>
    <link rel="stylesheet" href="style.css?v=3">
    <!-- Include FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container" id="container">
        <!-- Abstract Background Shapes -->
        <div class="bg-shapes">
            <div class="shape shape-solid-accent"></div>
            <div class="shape shape-outline-1"></div>
            <div class="shape shape-outline-2"></div>
            <div class="shape shape-outline-3"></div>
        </div>
        <!-- Dynamic Weather Particles -->
        <div id="weather-fx" class="weather-fx"></div>

        <div class="ui-layer">
            <!-- Top Bar: Logo & Search -->
            <header class="header">
                <div class="app-logo">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <span>Atmos</span>
                </div>
                <form id="search-form" class="search-form" autocomplete="off">
                    <div class="autocomplete">
                        <input type="text" id="search-bar" placeholder="Enter city...">
                    </div>
                    <button type="submit" id="search-Btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
            </header>

            <!-- Main Content -->
            <main class="weather-grid" id="Now">

                <!-- Left Column: Current Weather -->
                <section class="current-pane">
                    <div class="time-header">
                        <div id="time" class="time">--:--</div>
                        <div id="date" class="date">--- --, ----</div>
                    </div>

                    <div class="location-box">
                        <h1 id="city-name" class="city">Loading...</h1>
                        <h2 id="state-name" class="state">Please wait...</h2>
                    </div>

                    <div class="temperature-box">
                        <div id="current-temp" class="temp">--°</div>
                        <div class="temp-details">
                            <span id="condition">----</span>
                            <div class="high-low" id="high-low">H:--° L:--°</div>
                        </div>
                    </div>
                </section>

                <!-- Right Column: Details & Forecast -->
                <section class="details-pane">

                    <div class="extra-info glass-panel" id="current-weather-items">
                        <!-- Humidity, Wind, Sunrise, Sunset injected here -->
                    </div>

                    <!-- Forecast Tabs -->
                    <div class="forecast-container glass-panel">
                        <div class="forecast-tabs">
                            <button class="tab-btn active" data-tab="hourly">Hourly</button>
                            <button class="tab-btn" data-tab="daily">Daily <span>(7 days)</span></button>
                        </div>

                        <div class="forecast-content">
                            <div id="hourly-forecast" class="forecast-panel active">
                                <!-- Hourly items injected here -->
                            </div>
                            <div id="daily-forecast" class="forecast-panel">
                                <!-- Daily items injected here -->
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="script.js?v=3"></script>
</body>

</html>
